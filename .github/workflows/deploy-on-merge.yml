name: Secure Deploy to AWS on PR Merge

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # required for OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1  # or your region

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Your deploy step
        run: echo "Deploying to AWS..."

      - name: Install dependencies
        run: |
          npm install

      # Step 2: Assume the Lambda deployment role and deploy Lambda
      - name: Configure AWS credentials to deploy Lambda
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_DEPLOY_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Zip Lambda function
        run: |
          zip -r aws-basics-poc.zip . -x ".git/*" ".github/*" "aws-basics-poc.zip"
      # Step 3: Deploy the Lambda function using the assumed role

      - name: Deploy Lambda function
        run: |
          # Now, deploy Lambda using the assumed role
          aws lambda update-function-code \
            --function-name aws-basics-poc \
            --zip-file fileb://aws-basics-poc.zip
